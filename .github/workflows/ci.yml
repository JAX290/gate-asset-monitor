name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Zero npm dependencies — no `npm install` needed.
      - name: Syntax check
        run: find src deploy public test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Unit tests
        run: npm test

      - name: Offline export smoke test (34 tables + ZIP)
        env:
          DATA_DIR: ${{ runner.temp }}/gam-ci-data
          OUT_DIR: ${{ runner.temp }}/gam-ci-export
          DATA_MODE: mock
        run: |
          node deploy/export-all.js
          python3 - <<'PY'
          import glob, json, zipfile, os
          zips = glob.glob(os.path.join(os.environ['OUT_DIR'], '*.zip'))
          assert len(zips) == 1, f'expected 1 ZIP, got {len(zips)}'
          with zipfile.ZipFile(zips[0]) as z:
              assert z.testzip() is None, 'corrupt ZIP entry'
              names = z.namelist()
              csvs = [n for n in names if n.endswith('.csv')]
              manifests = [n for n in names if n.endswith('manifest.json')]
              assert len(csvs) == 34, f'expected 34 CSV tables, got {len(csvs)}'
              assert len(manifests) == 1
              m = json.loads(z.read(manifests[0]))
              assert len(m['datasets']) == 34
              print(f'OK: {len(names)} ZIP entries, 34 tables, {len(m["raw_files"])} raw files')
          PY
